name: Generar APK V7 - Icono y Nombre - La Doble B

"on": {workflow_dispatch: {}}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Crear proyecto Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/calculadoraplasticos/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          echo "" | base64 --decode > app/src/main/res/drawable/ic_launcher.png

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CalculadoraPlasticosCaratula"
          include(":app")
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.calculadoraplasticos.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.calculadoraplasticos.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 70
                  versionName '7.0'
              }
          }
          GRADLE

          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#0D6EFD</item>
                  <item name="android:statusBarColor">#0758B8</item>
                  <item name="android:navigationBarColor">#063B7A</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="Calculadora Costos La Doble B"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/java/com/calculadoraplasticos/app/MainActivity.java <<'JAVA'
          package com.calculadoraplasticos.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.content.Context;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.*;
          import java.util.Locale;

          public class MainActivity extends Activity {

              final int BLUE = Color.rgb(13,110,253);
              final int MID_BLUE = Color.rgb(35,148,255);
              final int DARK = Color.rgb(5,58,122);
              final int TEXT = Color.rgb(42,70,105);
              final int LIGHT = Color.rgb(235,246,255);
              final int BORDER = Color.rgb(157,205,255);
              final int WHITE = Color.WHITE;

              EditText w1,l1,t1,q1,d1,vkg1,w2,l2,p2;
              Spinner m1,u1,faces1,tu1,m2,u2,faces2;
              TextView rw,rqty,rnet,rtotal,rcostUnit,rcostTotal,rmic,rinch,rmil;
              LinearLayout weightCard, thicknessCard;
              RadioButton rbWeight, rbThickness;

              GradientDrawable rounded(int color, float radius) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(radius);
                  return d;
              }

              GradientDrawable outlined(int color, int stroke, float radius) {
                  GradientDrawable d = rounded(color,radius);
                  d.setStroke(2,stroke);
                  return d;
              }

              TextView text(String s,float size,int color,boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setTypeface(Typeface.DEFAULT,bold?Typeface.BOLD:Typeface.NORMAL);
                  return t;
              }

              LinearLayout.LayoutParams margins(int w,int h,int l,int top,int r,int bottom) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(w,h);
                  p.setMargins(l,top,r,bottom);
                  return p;
              }

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  build();
              }

              void build() {
                  ScrollView sv = new ScrollView(this);
                  sv.setFillViewport(true);
                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setPadding(18,14,18,28);
                  page.setBackground(rounded(DARK,0));
                  sv.addView(page);

                  // CARATULA VERTICAL
                  LinearLayout head = new LinearLayout(this);
                  head.setOrientation(LinearLayout.VERTICAL);
                  head.setGravity(Gravity.CENTER);
                  head.setPadding(22,24,22,26);
                  head.setBackground(rounded(BLUE,28));
                  page.addView(head,margins(-1,-2,0,0,0,18));

                  TextView recycle = text("♻",66,WHITE,true);
                  recycle.setGravity(Gravity.CENTER);
                  head.addView(recycle,margins(-1,82,0,0,0,6));

                  TextView a = text("PLÁSTICOS Y DESECHABLES",21,WHITE,true);
                  a.setGravity(Gravity.CENTER);
                  a.setMaxLines(2);
                  a.setPadding(10,6,10,6);
                  head.addView(a,margins(-1,-2,0,0,0,8));

                  TextView b = text("LA DOBLE B S.A.S.",25,WHITE,true);
                  b.setGravity(Gravity.CENTER);
                  b.setMaxLines(2);
                  b.setPadding(10,8,10,8);
                  head.addView(b,margins(-1,-2,0,0,0,14));

                  TextView app = text("CALCULADORA DE PESO Y CALIBRE",17,WHITE,true);
                  app.setGravity(Gravity.CENTER);
                  app.setPadding(16,10,16,10);
                  app.setBackground(rounded(MID_BLUE,28));
                  app.setMinHeight(72);
                  app.setMaxLines(2);
                  head.addView(app,margins(-1,-2,0,0,0,14));

                  TextView slogan = text("Juntos por un planeta más limpio",16,WHITE,true);
                  slogan.setGravity(Gravity.CENTER);
                  slogan.setPadding(10,6,10,6);
                  head.addView(slogan,margins(-1,-2,0,0,0,6));

                  // SELECTOR UNICO
                  LinearLayout selector = new LinearLayout(this);
                  selector.setOrientation(LinearLayout.VERTICAL);
                  selector.setPadding(18,18,18,20);
                  selector.setBackground(outlined(WHITE,BORDER,22));
                  page.addView(selector,margins(-1,-2,0,0,0,18));

                  TextView choose = text("¿QUÉ DESEA CALCULAR?",18,DARK,true);
                  choose.setGravity(Gravity.CENTER);
                  selector.addView(choose,margins(-1,42,0,0,0,10));

                  RadioGroup group = new RadioGroup(this);
                  group.setOrientation(RadioGroup.VERTICAL);
                  rbWeight = radio("CALIBRE → PESO");
                  rbThickness = radio("PESO → CALIBRE");
                  rbWeight.setMinHeight(62);
                   group.addView(rbWeight,margins(-1,-2,0,0,0,10));
                  rbThickness.setMinHeight(62);
                   group.addView(rbThickness,margins(-1,-2,0,0,0,0));
                  rbWeight.setChecked(true);
                  selector.addView(group,margins(-1,-2,0,0,0,0));

                  // UNA SOLA COLUMNA
                  weightCard = card();
                  thicknessCard = card();
                  page.addView(weightCard,margins(-1,-2,0,0,0,16));
                  page.addView(thicknessCard,margins(-1,-2,0,0,0,16));

                  buildWeight(weightCard);
                  buildThickness(thicknessCard);
                  thicknessCard.setVisibility(View.GONE);

                  group.setOnCheckedChangeListener((g,id)->{
                      if(id == rbWeight.getId()) {
                          weightCard.setVisibility(View.VISIBLE);
                          thicknessCard.setVisibility(View.GONE);
                      } else {
                          weightCard.setVisibility(View.GONE);
                          thicknessCard.setVisibility(View.VISIBLE);
                      }
                  });

                  TextView foot = text("LA DOBLE B S.A.S.  •  PLÁSTICOS Y DESECHABLES  •  Versión 7.0",12,WHITE,true);
                  foot.setGravity(Gravity.CENTER);
                  foot.setPadding(10,8,10,8);
                  foot.setMaxLines(2);
                  page.addView(foot,margins(-1,-2,0,6,0,0));

                  setContentView(sv);
              }

              RadioButton radio(String s) {
                  RadioButton r = new RadioButton(this);
                  r.setText(s);
                  r.setTextSize(17);
                  r.setTextColor(DARK);
                  r.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  r.setGravity(Gravity.CENTER_VERTICAL);
                  r.setPadding(14,0,10,0);
                  r.setBackground(rounded(LIGHT,18));
                  r.setButtonTintList(new android.content.res.ColorStateList(
                          new int[][]{new int[]{android.R.attr.state_checked},new int[]{}},
                          new int[]{BLUE,BORDER}));
                  r.setId(View.generateViewId());
                  return r;
              }

              LinearLayout card() {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(20,22,20,24);
                  c.setBackground(outlined(WHITE,Color.rgb(216,235,252),25));
                  c.setElevation(5);
                  return c;
              }

              void cardHeader(LinearLayout c,String title) {
                  TextView t = text(title,23,WHITE,true);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(18,0,18,0);
                  t.setBackground(rounded(BLUE,22));
                  t.setMinHeight(82);
                  t.setMaxLines(2);
                  t.setPadding(18,10,18,10);
                  c.addView(t,margins(-1,-2,0,0,0,20));
              }

              TextView label(LinearLayout c,String s) {
                  TextView t = text(s.toUpperCase(Locale.ROOT),14,WHITE,true);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  t.setPadding(18,0,18,0);
                  t.setBackground(rounded(BLUE,20));
                  t.setMinHeight(50);
                  t.setMaxLines(2);
                  t.setPadding(18,6,18,6);
                  c.addView(t,margins(-1,-2,0,4,0,10));
                  return t;
              }

              EditText edit(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setTextSize(17);
                  e.setSingleLine(true);
                   e.setMinHeight(58);
                  e.setTextColor(TEXT);
                  e.setHintTextColor(Color.rgb(120,145,175));
                  e.setPadding(18,0,18,0);
                  e.setBackground(outlined(WHITE,BORDER,15));
                  e.setInputType(android.text.InputType.TYPE_CLASS_NUMBER |
                          android.text.InputType.TYPE_NUMBER_FLAG_DECIMAL);
                  e.setImeOptions(EditorInfo.IME_ACTION_DONE);
                  e.setOnEditorActionListener((v, actionId, event) -> {
                      if (actionId == EditorInfo.IME_ACTION_DONE ||
                          (event != null && event.getKeyCode() == android.view.KeyEvent.KEYCODE_ENTER)) {
                          InputMethodManager imm=(InputMethodManager)getSystemService(Context.INPUT_METHOD_SERVICE);
                          imm.hideSoftInputFromWindow(v.getWindowToken(),0);
                          v.clearFocus();
                          return true;
                      }
                      return false;
                  });
                  return e;
              }

              Spinner spin(String[] items) {
                  Spinner s = new Spinner(this);
                  ArrayAdapter<String> a = new ArrayAdapter<String>(
                          this,android.R.layout.simple_spinner_dropdown_item,items) {
                      @Override public View getView(int p,View v,ViewGroup parent) {
                          TextView t=(TextView)super.getView(p,v,parent);
                          t.setTextSize(17);
                          t.setTextColor(TEXT);
                          t.setGravity(Gravity.CENTER_VERTICAL);
                          t.setPadding(16,0,16,0);
                          return t;
                      }
                  };
                  s.setAdapter(a);
                  s.setBackground(outlined(WHITE,BORDER,15));
                  return s;
              }

              void addFull(LinearLayout c,View v) {
                  c.addView(v,margins(-1,64,0,0,0,14));
              }

              Button calcButton(String s) {
                  Button b=new Button(this);
                  b.setText(s);
                  b.setTextColor(WHITE);
                  b.setTextSize(18);
                  b.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  b.setAllCaps(false);
                  b.setBackground(rounded(BLUE,22));
                  b.setGravity(Gravity.CENTER);
                  b.setMinHeight(76);
                  b.setPadding(18,10,18,10);
                  return b;
              }

              LinearLayout results(LinearLayout c) {
                  LinearLayout r=new LinearLayout(this);
                  r.setOrientation(LinearLayout.VERTICAL);
                  r.setPadding(16,16,16,18);
                  r.setBackground(rounded(LIGHT,22));
                  c.addView(r,margins(-1,-2,0,4,0,0));
                  TextView h=text("RESULTADOS",17,DARK,true);
                  h.setGravity(Gravity.CENTER);
                  r.addView(h,margins(-1,38,0,0,0,12));
                  return r;
              }

              TextView result(LinearLayout r,String name,String value) {
                  LinearLayout box=new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setPadding(12,6,12,6);
                  box.setBackground(outlined(WHITE,Color.rgb(203,226,248),15));
                  box.setMinimumHeight(188);
                  box.setPadding(16,16,16,16);
                  r.addView(box,margins(-1,-2,0,0,0,16));
                  TextView n=text(name.toUpperCase(Locale.ROOT),13,DARK,true);
                  n.setGravity(Gravity.CENTER);
                  n.setMaxLines(2);
                  n.setPadding(8,8,8,8);
                  box.addView(n,margins(-1,-2,0,0,0,8));
                  TextView v=text(value,22,BLUE,true);
                  v.setGravity(Gravity.CENTER);
                  v.setMaxLines(2);
                  v.setPadding(8,8,8,8);
                  box.addView(v,margins(-1,-2,0,0,0,0));
                  return v;
              }

              void buildWeight(LinearLayout c) {
                  cardHeader(c,"CALIBRE → PESO");

                  label(c,"Material");
                  m1=spin(new String[]{"PEAD","PEBD","LINEAL","PP"}); addFull(c,m1);

                  label(c,"Unidad de medida");
                  u1=spin(new String[]{"Centímetros (cm)","Pulgadas (in)"}); addFull(c,u1);

                  label(c,"Ancho");
                  w1=edit("Ingrese ancho, ej. 30"); addFull(c,w1);

                  label(c,"Largo");
                  l1=edit("Ingrese largo, ej. 40"); addFull(c,l1);

                  label(c,"Caras / capas");
                  faces1=spin(new String[]{"2 - Bolsa normal","1 - Una cara","3","4"}); addFull(c,faces1);

                  label(c,"Unidad del calibre");
                  tu1=spin(new String[]{"Micrones (µm)","Pulgadas (in)","Mil"}); addFull(c,tu1);

                  label(c,"Calibre / espesor");
                  t1=edit("Ej. 20 o 0.00040"); addFull(c,t1);

                  label(c,"Cantidad de bolsas");
                  q1=edit("Ej. 100"); addFull(c,q1);

                  label(c,"Desperdicio %");
                  d1=edit("Ej. 3"); addFull(c,d1);

                  label(c,"Valor por kilogramo (antes de IVA)");
                  vkg1=edit("Ej. 8500"); addFull(c,vkg1);

                  Button b=calcButton("▣   CALCULAR PESO");
                  c.addView(b,margins(-1,68,0,8,0,16));
                  b.setOnClickListener(v->calcWeight());

                  LinearLayout rr=results(c);
                  rw=result(rr,"Peso por bolsa","0.000 g");
                  rqty=result(rr,"Cantidad","0");
                  rnet=result(rr,"Peso neto total","0.000 kg");
                  rtotal=result(rr,"Materia prima + desperdicio","0.000 kg");
                  rcostUnit=result(rr,"Costo materia prima antes de IVA · X UND","$ 0.00");
                  rcostTotal=result(rr,"Costo materia prima antes de IVA · X CANTIDAD","$ 0.00");
              }

              void buildThickness(LinearLayout c) {
                  cardHeader(c,"PESO → CALIBRE");

                  label(c,"Material");
                  m2=spin(new String[]{"PEAD","PEBD","LINEAL","PP"}); addFull(c,m2);

                  label(c,"Unidad de medida");
                  u2=spin(new String[]{"Centímetros (cm)","Pulgadas (in)"}); addFull(c,u2);

                  label(c,"Ancho");
                  w2=edit("Ej. 30"); addFull(c,w2);

                  label(c,"Largo");
                  l2=edit("Ej. 40"); addFull(c,l2);

                  label(c,"Caras / capas");
                  faces2=spin(new String[]{"2 - Bolsa normal","1 - Una cara","3","4"}); addFull(c,faces2);

                  label(c,"Peso de una bolsa (gramos)");
                  p2=edit("Ej. 1.196"); addFull(c,p2);

                  Button b=calcButton("▣   CALCULAR CALIBRE");
                  c.addView(b,margins(-1,68,0,8,0,16));
                  b.setOnClickListener(v->calcThickness());

                  LinearLayout rr=results(c);
                  rmic=result(rr,"Micrones","0.000 µm");
                  rinch=result(rr,"Pulgadas","0.0000000 in");
                  rmil=result(rr,"Mil","0.0000 mil");
              }

              double density(String m) {
                  if(m.equals("PEAD")) return 0.95;
                  if(m.equals("PEBD")) return 0.92;
                  if(m.equals("LINEAL")) return 0.925;
                  return 0.90;
              }

              double val(EditText e) {
                  String s=e.getText().toString().trim().replace(",",".");
                  return s.length()==0?0:Double.parseDouble(s);
              }

              // LA UNIDAD DE MEDIDA PRINCIPAL CONTROLA ANCHO Y LARGO.
              double dimensionCm(EditText e,Spinner unit) {
                  double x=val(e);
                  return unit.getSelectedItemPosition()==1 ? x*2.54 : x;
              }

              int layers(Spinner s) {
                  String x=s.getSelectedItem().toString();
                  if(x.startsWith("1")) return 1;
                  if(x.startsWith("3")) return 3;
                  if(x.startsWith("4")) return 4;
                  return 2;
              }

              double micron(EditText e,Spinner unit) {
                  double x=val(e);
                  int p=unit.getSelectedItemPosition();
                  if(p==1) return x*25400.0;
                  if(p==2) return x*25.4;
                  return x;
              }

              // FORMULA ORIGINAL CONSERVADA:
              // gramos = ancho(cm) × largo(cm) × micrones × densidad × capas / 10000
              void calcWeight() {
                  try {
                      double w=dimensionCm(w1,u1);
                      double l=dimensionCm(l1,u1);
                      double t=micron(t1,tu1);
                      int f=layers(faces1);
                      double d=density(m1.getSelectedItem().toString());
                      if(w<=0||l<=0||t<=0) { toast("Completa ancho, largo y calibre."); return; }

                      double grams=w*l*t*d*f/10000.0;
                      double qty=val(q1); if(qty<=0) qty=1;
                      double waste=val(d1);
                      double net=grams*qty/1000.0;
                      double total=net*(1+waste/100.0);

                      double valueKg=val(vkg1);
                      double costTotal=total*valueKg;
                      double costUnit=costTotal/qty;

                      rw.setText(String.format(Locale.US,"%.3f g",grams));
                      rqty.setText(String.format(Locale.US,"%.0f bolsas",qty));
                      rnet.setText(String.format(Locale.US,"%.3f kg",net));
                      rtotal.setText(String.format(Locale.US,"%.3f kg",total));
                      rcostUnit.setText(String.format(Locale.US,"$ %.2f",costUnit));
                      rcostTotal.setText(String.format(Locale.US,"$ %.2f",costTotal));
                  } catch(Exception e) { toast("Revisa los datos ingresados."); }
              }

              void calcThickness() {
                  try {
                      double w=dimensionCm(w2,u2);
                      double l=dimensionCm(l2,u2);
                      double weight=val(p2);
                      int f=layers(faces2);
                      double d=density(m2.getSelectedItem().toString());
                      if(w<=0||l<=0||weight<=0) { toast("Completa ancho, largo y peso."); return; }

                      double mic=weight*10000.0/(w*l*d*f);
                      rinch.setText(String.format(Locale.US,"%.7f in",mic/25400.0));
                      rmic.setText(String.format(Locale.US,"%.3f µm",mic));
                      rmil.setText(String.format(Locale.US,"%.4f mil",mic/25.4));
                  } catch(Exception e) { toast("Revisa los datos ingresados."); }
              }

              void toast(String s) {
                  Toast.makeText(this,s,Toast.LENGTH_SHORT).show();
              }
          }
          JAVA

      - name: Compilar APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ejecutar Gradle
        run: gradle assembleDebug

      - name: Entregar APK V7
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraPlasticos-LaDobleB-V7
          path: app/build/outputs/apk/debug/app-debug.apk
